name: Tests

on:
  push:
    branches:
      - "**"   # tags are tested by release.yml before it packages
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lupa and pytest
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest tests
